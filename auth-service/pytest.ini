[pytest]
# Пути для поиска модулей
pythonpath = .

# Режим asyncio для поддержки async тестов и фикстур
asyncio_mode = auto

# Параметры запуска
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Маркеры для организации тестов
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    async: Async tests

# Фильтрация предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*pydantic.*:UserWarning
    ignore:.*sqlalchemy.*:DeprecationWarning
    ignore:.*greenlet.*:RuntimeWarning

# Настройки для asyncio
asyncio_default_fixture_loop_scope = function

# Путь к директории с тестами
testpaths = tests
