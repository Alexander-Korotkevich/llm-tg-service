[pytest]
pythonpath = .
asyncio_mode = auto

markers =
    unit: Модульные тесты (чистая логика, без внешних зависимостей)
    mock: Тесты с моками (fakeredis, мок Celery)
    integration: Интеграционные тесты (с respx моками HTTP)
    slow: Медленные тесты
    jwt: Тесты JWT функциональности
    handlers: Тесты Telegram хендлеров
    openrouter: Тесты OpenRouter клиента

log_cli = false
log_cli_level = INFO

minversion = 7.0
norecursedirs = .git .venv venv env __pycache__ *.egg-info .pytest_cache
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*
