[pytest]
# Добавляем корневую директорию в PYTHONPATH для корректного импорта модулей
pythonpath = .

# Автоматический режим работы с asyncio (позволяет использовать async фикстуры и тесты)
asyncio_mode = auto

# Отключаем предупреждения о переопределении фикстур (полезно при сложных тестах)
# filterwarnings =
#     ignore::pytest.PytestCollectionWarning

# Настройки логирования в тестах
log_cli = false
log_cli_level = INFO

# Маркеры для группировки тестов
markers =
    unit: Модульные тесты (быстрые, изолированные)
    integration: Интеграционные тесты (требуют внешних зависимостей)
    slow: Медленные тесты (можно пропускать при быстром запуске)
    async: Асинхронные тесты
    redis: Тесты, использующие Redis
    celery: Тесты, использующие Celery
    jwt: Тесты для JWT функциональности

# Настройки для сбора покрытия (если используется pytest-cov)
# addopts = --cov=app --cov-report=term-missing --cov-report=html

# Таймаут для тестов в секундах (если используется pytest-timeout)
# timeout = 30

# Минимальная версия Python
minversion = 7.0

# Папки, которые не нужно сканировать при поиске тестов
norecursedirs = .git .venv venv env __pycache__ *.egg-info .pytest_cache

# Префиксы файлов с тестами
python_files = test_*.py *_test.py

# Классы с тестами
python_classes = Test* *Test

# Функции с тестами
python_functions = test_*
